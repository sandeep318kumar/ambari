# Docker Compose for Apache Ambari
# Production-ready setup with all fixes applied

version: '3.8'

services:
  ambari-server:
    image: ambari:latest
    container_name: ambari-server
    hostname: ambari-server
    ports:
      - "8080:8080"
      - "8440:8440"
      - "8441:8441"
    environment:
      - AMBARI_CONF_DIR=/opt/ambari/conf
      - JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
      - PYTHONPATH=/opt/ambari/agent/lib/ambari-agent/lib:/opt/ambari/agent/lib/ambari-agent:/opt/ambari/server/lib/ambari-server/lib:/opt/ambari/server/lib/ambari-server:/opt/ambari/server/lib:/opt/ambari/server:
    volumes:
      - ambari-server-data:/var/lib/ambari-server
      - ambari-server-logs:/opt/ambari/logs
      - ambari-server-conf:/opt/ambari/conf
    networks:
      - ambari-network
    command: ["StartServer"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ambari-agent:
    image: ambari:latest
    container_name: ambari-agent
    hostname: ambari-agent
    depends_on:
      - ambari-server
    environment:
      - AMBARI_CONF_DIR=/opt/ambari/conf
      - JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
      - PYTHONPATH=/opt/ambari/agent/lib/ambari-agent/lib:/opt/ambari/agent/lib/ambari-agent:/opt/ambari/server/lib/ambari-server/lib:/opt/ambari/server/lib/ambari-server:/opt/ambari/server/lib:/opt/ambari/server:
      - AMBARI_SERVER_HOST=ambari-server
    volumes:
      - ambari-agent-data:/var/lib/ambari-agent
      - ambari-agent-logs:/var/log/ambari-agent
    networks:
      - ambari-network
    command: ["StartAgent"]
    restart: unless-stopped

  # PostgreSQL database for Ambari metadata
  ambari-db:
    image: postgres:13
    container_name: ambari-db
    hostname: ambari-db
    environment:
      - POSTGRES_DB=ambari
      - POSTGRES_USER=ambari
      - POSTGRES_PASSWORD=bigdata
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - ambari-db-data:/var/lib/postgresql/data
    networks:
      - ambari-network
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  ambari-server-data:
    driver: local
  ambari-server-logs:
    driver: local
  ambari-server-conf:
    driver: local
  ambari-agent-data:
    driver: local
  ambari-agent-logs:
    driver: local
  ambari-db-data:
    driver: local

networks:
  ambari-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

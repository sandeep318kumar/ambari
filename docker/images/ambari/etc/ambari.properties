# Ambari Server Configuration
server.persistence.type=local
server.jdbc.driver.path=/opt/ambari/server/lib/ambari-server/postgresql-42.2.14.jar

# Database Configuration
server.jdbc.url=jdbc:postgresql://localhost:5432/ambari
server.jdbc.user.name=ambari
server.jdbc.user.passwd=/opt/ambari/conf/password.dat
server.jdbc.driver=org.postgresql.Driver
server.jdbc.database=postgres
server.jdbc.database.name=ambari
server.persistence.type=local

# Security Configuration
security.server.keys_dir=/opt/ambari/conf/keys
security.server.disabled.ciphers=SSL_RSA_WITH_DES_CBC_SHA|SSL_DHE_RSA_WITH_DES_CBC_SHA|SSL_DHE_DSS_WITH_DES_CBC_SHA|SSL_RSA_EXPORT_WITH_RC4_40_MD5|SSL_RSA_EXPORT_WITH_DES40_CBC_SHA|SSL_DHE_RSA_EXPORT_WITH_DES40_CBC_SHA|SSL_DHE_DSS_EXPORT_WITH_DES40_CBC_SHA
security.server.disabled.protocols=SSLv2|SSLv3

# Server Configuration
server.connection.max.idle.millis=900000
server.fqdn.service.url=http://169.254.169.254/latest/meta-data/public-hostname
server.http.session.inactive_timeout=1800
server.stages.parallel=true
server.tmp.dir=/opt/ambari/tmp
server.pid.dir=/opt/ambari/run
server.out.dir=/opt/ambari/logs
server.log.dir=/opt/ambari/logs
server.resources.dir=/opt/ambari/resources
server.os_family=ubuntu
server.os_type=ubuntu22

# Views Configuration
views.dir=/opt/ambari/resources/views
views.validate=false

# Bootstrap Configuration
bootstrap.dir=/opt/ambari/bootstrap
bootstrap.script=/opt/ambari/server/lib/ambari-server/bootstrap.py
bootstrap.setup_agent.script=/opt/ambari/server/lib/ambari-server/setupAgent.py

# Recommendations Configuration
recommendations.dir=/opt/ambari/stack-recommendations

# Custom Action Configuration
custom.action.definitions=/opt/ambari/resources/custom_action_definitions

# Resources Configuration
resources.dir=/opt/ambari/resources
webapp.dir=/opt/ambari/server/web

# Server Startup Configuration
server.startup.web.timeout=50000

# Rolling Upgrade Configuration
rolling.upgrade.skip.packages.prefixes=

# Kerberos Configuration
kerberos.keytab.cache.dir=/opt/ambari/data/cache

# Metrics Configuration
metrics.retrieval-service.thread.pool.size.core=5
metrics.retrieval-service.thread.pool.size.max=10

# Agent Configuration
agent.package.install.task.timeout=1800
agent.stack.retry.tries=5
agent.stack.retry.on_repo_unavailability=false
agent.auto.cache.update=true

# API Configuration
api.authenticated.user=admin
api.ssl=false

# Cluster Configuration
cluster.cache.size=10000

# Default Stack Version
stack.upgrade.bypass.prechecks=false

# JDK Configuration
jdk.name=jdk1.8
jce.name=jce_policy-8

# Repository Configuration
repo.validation.suffixes.ubuntu=/dists/%s/Release
repo.validation.suffixes.debian=/dists/%s/Release
repo.validation.suffixes.redhat=/repodata/repomd.xml
repo.validation.suffixes.suse=/repodata/repomd.xml

# Package Configuration
package.install.task.timeout=1800

# Service Configuration
service.check.task.timeout=300

# Execution Configuration
execution.scheduler.maxThreads=5
execution.scheduler.maxDbConnections=5

# Recovery Configuration
recovery.enabled_components=
recovery.lifetime_max_count=1024
recovery.max_count=6
recovery.window_in_minutes=60
recovery.retry_interval=5
recovery.type=AUTO_START

# Alerts Configuration
alerts.cache.enabled=true
alerts.cache.size=50000
alerts.cache.flush.interval=10
alerts.execution.scheduler.maxThreads=2

# Ambari Configuration
ambari.python.wrap=ambari-python-wrap
